# MTÜ Lapikud põhikiri
# Allikas: vana lapikud.ee /statute leht

updated: "Vastu võetud asutamiskoosolekul 23. veebruaril 2002, täiendatud 20. mail 2004 ja 4. mail 2018."

chapters:
  - title: "1. ÜLDSÄTTED"
    items:
      - text: "1.1 Mittetulundusühingu (edaspidi “Ühing”) nimeks on mittetulundusühing Lapikud (lühendatult MTÜ Lapikud)."
      - text: "1.1.1 Ühingu mitteametlik nimi on Tallinna Tehnikaülikooli Tarkvaraarenduse klubi."
      - text: "1.2 Ühingu asukohaks on Eesti Vabariik, Tallinn."
      - text: "1.3 Ühing on mittetulundusühinguna eraõiguslik juriidiline isik, mis oma tegevuses juhindub Eesti Vabariigi seadustest, käesolevast põhikirjast ja muudest õigusaktidest."
      - text: "1.4 Ühingu missiooniks on tegeleda tudengiteadusega infotehnoloogia valdkonnas Tallinna Tehnikaülikoolis."
      - text: "1.4.1 Ühingu ülesanneteks on:"
      - list:
          - "Tallinna Tehnikaülikooli infotehnoloogiast huvitatud üliõpilaste koondamine ja rakendamine tarkvaraarenduse projektidesse."
          - "Info- ja telekommunikatsiooni alase õppetöö nõustamine."
      - text: "1.4.2 Ühingu tegevuse põhimõteteks on:"
      - list:
          - "liikmete hääleõiguse võrdsus;"
          - "liikmelisuse vabatahtlikkus ja mitteüleantavus;"
          - "liikmete, ainult põhikirjast tulenevad, kohustused Ühingu ees;"
          - "liikmete õigus Ühingust välja astuda;"
          - "liikmete vahel mittejaotatava vara, tulu ja kapitali olemasolu."
      - text: "1.4.3 Ühingu põhitegevuseks ei ole majandustegevuse kaudu tulu saamine."
      - text: "1.5 Ühing võib omada varalisi ja mittevaralisi õigusi ning võtta kohustusi, tal on oma vara, iseseisev bilanss ning oma sümboolika."
      - text: "1.6 Ühing vastutab oma kohustuste täitmise eest kogu oma varaga. Ühingu liige vastutab Ühingu kohustuste täitmise eest vaid tasutud liikmemaksu (sisseastumismaksu ja aastamaksude) ulatuses."
      - text: "1.7 Ühing on asutatud määramata ajaks."
      - text: "1.8 Ühingu majandusaasta algus on 1. jaanuaril ja lõpp 31. detsembril."
      - text: "1.9 Ühingu töökeeleks on eesti keel."

  - title: "2. LIIKMELISUS. LIIKMETE ÕIGUSED JA KOHUSTUSED"
    items:
      - text: "2.1 Kui käesolevas põhikirjas ei ole sätestatud teisiti, võib Ühingu liikmeks astuda iga füüsiline isik, kes on õppinud või õpib Tallinna Tehnikaülikoolis. Liikmeks vastuvõtu otsustab juhatus 1 kuu jooksul alates avalduse esitamisest. Juhatus peab liikmete registrit."
      - text: "2.2 Üldkoosolek võib erandkorras ja lihthäälteenamusega ühingu liikmeks vastu võtta ka punkti 2.1 nõudmistele mittevastavaid isikuid."
      - text: "2.3 Liikmetel on õigus:"
      - list:
          - "osaleda Ühingu koosolekutel;"
          - "valida Ühingu juhatust ning revisjonikomisjoni;"
          - "kandideerida Ühingu juhatusse ja/või revisjonikomisjoni;"
          - "saada teavet ühingu tegevuse tulemuste kohta;"
          - "astuda ühingust välja;"
          - "osaleda juhatuse koosolekul juhul, kui koosolekut ei ole kuulutatud kinniseks;"
          - "teha ettepanekuid Ühingu tegevuse tõhustamiseks;"
          - "osaleda Ühingu poolt informaatikatudengitele korraldatavatel üritustel;"
          - "algatada Ühingu põhikirja muutmist vähemalt ühe kümnendiku Ühingu liikmete ühisavaldusega;"
          - "Juhatus rahuldab väljaastumise avalduse 1 kuu jooksul avalduse esitamise päevast /arvates/ alates. Kui liikmelisus lõpeb majandusaasta kestel, siis aastamaksu ei tagastata ning selle aasta eest kuulub liikmemaks tasumisele."
      - text: "2.4 Kui ühingu juhatus ei ole mingil põhjusel võimeline sisseastumis- või lahkumisavaldust ettenähtud aja jooksul rahuldama, otsustab liikme sisse- või väljaastumise üldkoosolek."
      - text: "2.5 Ühingu auliikmeks võib olla iga füüsiline või juriidiline isik."
      - text: "2.6 Ühingu auliikmeks vastu võtmise või auliikme staatuse tühistamise otsustab üldkoosolek."
      - text: "2.7 Ühingu auliige ei ole hääleõiguslik ega või olla valitud juhatuse ega revisjonikomisjoni liikmeks."
      - text: "2.8 Ühingu liikmelisus on seotud sisseastumismaksuga ja aastamaksuga. Liikmed tasuvad sisseastumismaksu ja aastamaksu ühingu pangaarvele üldkoosoleku poolt kindlaksmääratud suuruses ja tähtajaks."
      - text: "2.9 Ühingu auliikmele sisseastumismaksu ja aastamaksu ei rakendata."
      - text: "2.10 Ühingu liige võidakse ühingust välja arvata:"
      - list:
          - "kui liige ei täida põhikirjaga sätestatud kohustusi;"
          - "liikme surma puhul;"
          - "kui liige on saanud hakkama vääritu teoga;"
          - "Liikme ühingust välja arvamise otsustab juhatus."
      - text: "2.11 Juhatuse otsuse liikme väljaarvamise kohta võib liige edasi kaevata ühingu üldkoosolekule seaduses ettenähtud korras ja nõuda enda väljaarvamise otsustamist üldkoosoleku poolt."
      - text: "2.12 Isikul, kelle liikmelisus ühingus on lõppenud, ei ole õigusi ühingu vara suhtes."
      - text: "2.13 Ühingu liige on kohustatud:"
      - list:
          - "täitma põhikirja järgseid nõudeid ja ühingu juhtorganite seaduspäraseid otsuseid;"
          - "õigeaegselt tasuma aastamaksu;"
          - "mitte rikkuma ühingu mainet."

  - title: "3. JUHTIMINE"
    items:
      - text: "3.1 Ühingu kõrgeimaks organiks on selle liikmete üldkoosolek, kus võivad osaleda kõik ühingu liikmed. Üldkoosolek tuleb kokku vähemalt 1 kord aastas."
      - text: "3.2 Üldkoosolek võtab vastu otsuseid kõikides ühingu juhtimise küsimustes, mida ei ole seaduse või käesoleva põhikirjaga antud juhatuse või ühingu muu organi pädevusse."
      - text: "3.3 Üldkoosoleku pädevusse kuulub:"
      - list:
          - "ühingu ühinemine ja jagunemine;"
          - "põhikirja muutmine;"
          - "eesmärkide muutmine;"
          - "juhatuse liikmete määramine;"
          - "juhatuse või selle liikmete tagasikutsumine;"
          - "juhatuse pädevust ületades tehtud otsuse tühistamine;"
          - "muude põhikirjaga ettenähtud organite liikmete valimine;"
          - "aastaaruande ja bilansi ning revisjoniaruande kinnitamine;"
          - "hinnangu andmine juhatuse tegevusele;"
          - "juhatuse või muu organi liikmega tehingu tegemise või tema vastu nõude esitamise otsustamine ja selles tehingus või nõudes ühingu esindaja määramine;"
          - "muude küsimuste otsustamine, mida ei ole seaduse või põhikirjaga antud ühingu teiste organite pädevusse."
      - text: "3.4 Üldkoosoleku otsused on avalikud ja avaldatakse Ühingu koduleheküljel."
      - text: "3.5 Ühingu põhikirja või tegevuse eesmärkide muutmiseks on vajalik vähemalt 50% ühingu liikmete või nende esindajate osavõtt üldkoosolekul. Põhikirja või eesmärkide muutmise otsus on vastu võetud, kui selle poolt hääletavad üle 50% koosolekul osalenud liikmetest või nende lihtkirjalikult volitatud esindajatest."
      - text: "3.6 Ühingu juhtorganiks on juhatus, kes üldkoosolekute vahelisel ajal esindab Ühingut ja kes juhib Ühingu põhikirjalist tegevust ja täidab käesoleva põhikirjaga talle pandud ülesandeid ning üldkoosoleku poolt delegeeritud õiguste ja kohustuste piires."
      - text: "3.7 Üldkoosolek valib demokraatlikel valimistel salajasel hääletamisel kolme- kuni viieliikmelise juhatuse. Ühingu juhatuse liikmeid saab valida Ühingu liikmete seast. Juhatuse volituse aja ning selleks ajaks valitavate juhatuse liikmete arvu otsustab üldkoosolek."
      - text: "3.8 Juhatuse ülesanded:"
      - list:
          - "Ühingu esindamine nii Tallinna Tehnikaülikoolis kui väljaspool seda;"
          - "Ühingu liikmete informeerimine oma tegevusest;"
          - "Ühingu liikmete info haldamine;"
          - "valmistada ette ja kuulutada välja üldkoosolekuid;"
          - "korraldada Ühingu käsutuses oleva vara valdamist ja kasutamist;"
          - "korraldada Ühingu rahaliste vahendite käsutamist üldkoosoleku poolt kehtestatud korras;"
          - "korraldada juhatuse koosolekuid vähemalt 2 korda poolaasta jooksul;"
          - "muud Ühingu eesmärkidega kooskõlas olevad ülesanded."
      - text: "3.9 Üldkoosoleku otsusega võib poolte kokkuleppel Ühingu juhatusele anda täiendavaid ülesandeid."
      - text: "3.10 Juhatus teatab oma otsustest liikmetele, kas suuliselt või kirjalikult, ühe nädala jooksul."
      - text: "3.11 Juhatus on aruandekohustuslik üldkoosoleku ees."
      - text: "3.12 Juhatuse otsused võetakse vastu juhatuse koosolekul lihthäälteenamuse alusel. Juhatuse koosolek on otsustusvõimeline, kui kohal on vähemalt 2/3 juhatuse liikmetest."
      - text: "3.13 Juhatuse liikmetel on õigus saada tagasivalituks."
      - text: "3.14 Juhatus korraldab ühingu raamatupidamist vastavalt raamatupidamise seadusele ning omab aruandekohustust üldkoosoleku ees vastavalt seadusele."
      - text: "3.15 Juhatuse igal liikmel on õigus esindada ühingut kõikides õigustoimingutes eraldi."
      - text: "3.16 Juhatuse liikme tagasi kutsumiseks on vajalik vähemalt 50% ühingu liikmete või nende esindajate osavõtt üldkoosolekul. Tagasikutsumise otsustab üldkoosolek salajasel hääletusel. Juhatuse liikme tagasi kutsumise otsus on vastu võetud, kui selle poolt hääletavad üle 50% koosolekul osalenud liikmetest või nende esindajatest."
      - text: "3.17 Tagasikutsumist võib algatada, kui seda nõuavad vähemalt 10% Ühingu liikmetest."
      - text: "3.18 Tagasikutsumine tuleb vormistada kirjalikult ning esitada Ühingu juhatusele. Tagasikutsumisavalduse peab päevakorda võtma esitamisele järgneval üldkoosolekul esimese päevakorrapunktina."
      - text: "3.19 Juhatuse liikme tagasiastumise või ühingust välja arvamise korral valib üldkoosolek uue juhatuse liikme järgmisel korralisel või erakorralisel üldkoosolekul."

  - title: "4. ÜHINGU TÖÖKORD"
    items:
      - text: "4.1 Ühingu töö vormiks on koosolek."
      - text: "4.2 Koosoleku kutsub kokku Ühingu juhatus või projektijuht."
      - text: "4.3 Korralisest üldkoosolekust tuleb juhatusel Ühingu liikmeid teavitada vähemalt 3 nädalat enne üldkoosoleku toimumist ning erakorralisest üldkoosolekust vähemalt 1 nädal enne. Teavitamine käib läbi Ühingu kodulehekülje, meililisti või e-posti teel."
      - text: "4.4 Koosoleku kokkukutsujal on õigus koosolek kuulutada kinniseks. Kinnise koosoleku ajal võivad koosoleku ruumis viibida vaid Ühingu liikmed ning koosoleku kokkukutsujalt selleks loa saanud inimesed."
      - text: "4.5 Üldkoosolekuid juhatab üks juhatuse liikmeist."
      - text: "4.6 Juhatus võib soovi korral valida üldkoosolekut juhatama ka teisi Ühingu liikmeid."
      - text: "4.7 Igal Ühingu liikmel on üks hääl. Üldkoosolek on otsustusvõimeline, kui sellel osaleb või on lihtkirjalike volituste alusel esindatud vähemalt 30% ühingu liikmeist. Otsused võetakse vastu lihthäälteenamuse alusel, kui konkreetse juhu kohta pole põhikirjas sätestatud teisiti. Kui üldkoosolek ei ole ülalsätestatud kvooruminõude tõttu pädev otsuseid vastu võtma, kutsub juhatus ühe nädala jooksul kokku uue üldkoosoleku sama päevakorraga. Uus üldkoosolek on pädev otsuseid vastu võtma, sõltumata üldkoosolekul osalenud või esindatud liikmete arvust, kuid üksnes juhul, kui üldkoosolekul osaleb või on esindatud vähemalt 7 liiget."
      - text: "4.8 Hääletada saab otsuse poolt, vastu või jääda erapooletuks."
      - text: "4.9 Hääletamine Ühingu koosolekul on avalik, kui käesolevas põhikirjas ei ole ette nähtud teisiti."
      - text: "4.10 Kõik koosolekul toimuvad isikuvalimised on salajased."
      - text: "4.11 Koosoleku kokkukutsuja võib otsustada, et hääletus on salajane, kui seda nõuab vähemalt 5 Ühingu liiget."
      - text: "4.12 Kõiki Ühingu koosolekuid protokollitakse ja vastuvõetud otsused vormistatakse eraldi aktina."
      - text: "4.13 Ühingu koosoleku protokoll ja otsused peavad olema tehtud kättesaadavaks kümne tööpäeva jooksul pärast koosoleku toimumist."

  - title: "5. MAJANDUSTEGEVUS JA VARA JAOTUS"
    items:
      - text: "5.1 Ühingu vara tekib liikmete sisseastumismaksudest, aastamaksudest ja muudest maksetest, ühingu vara kasutamisest ja tegevusest saadavast tulust ning muudest laekumistest või annetustest."
      - text: "5.2 Ühing ekspluateerib ja remondib tema valduses või omandis olevat vara täieliku isemajandamise põhimõttel ja lepinguvabaduse tingimustes."
      - text: "5.3 Vara valdamist, kasutamist ja säilimist ning rahaliste vahendite käsutamist korraldab Ühingu juhatus põhikirjaliste ülesannete täitmiseks kooskõlas õigusaktide ja kehtestatud korraga."

  - title: "6. TEADETE AVALIKUSTAMINE"
    items:
      - text: "6.1 Juhatuse, revisjonikomisjoni ja muude ühingu organite teated ühingu liikmetele avalikustatakse üldkoosolekul."
      - text: "6.2 Edasilükkamatuid ja kiireloomulisi teateid võidakse avalikustada liikmeile ka globaalsete, üleriigiliste või kohalike meediakanalite kaudu."

  - title: "7. KONTROLL JA REVIDEERIMINE"
    items:
      - text: "7.1 Üldkoosolek teostab järelvalvet teiste ühingu organite tegevuse üle. Selle ülesande täitmiseks võib määrata üldkoosolek revisjoni või audiitorkontrolli. Revisjoni volituste aja ning selleks ajaks valitavate revisjonikomisjoni liikmete arvu otsustab üldkoosolek."
      - text: "7.2 Revisjonikomisjoni liige ei pea olema Ühingu liige."
      - text: "7.3 Revisjonikomisjoni liige ei tohi kuuluda juhatusse."
      - text: "7.4 Revisjonikomisjon on aruandekohustuslik üldkoosoleku ees."
      - text: "7.5 Juhatuse ja muu organi liikmed peavad võimaldama revidendil (revisjonikomisjonil) või audiitoril tutvuda kõigi revisjoni või audiitorkontrolli läbiviimiseks vajalike dokumentidega ning andma vajalikku teavet."

  - title: "8. LÕPETAMINE, ÜHINEMINE JA JAGUNEMINE"
    items:
      - text: "8.1 Ühingu lõpetamine, ühinemine ja jagunemine toimub seaduses sätestatud korras."
      - text: "8.2 Ühingu lõpetamise, ühinemise ja jagunemise otsustamiseks on vajalik vähemalt 2/3 ühingu liikmete või nende esindajate osavõtt üldkoosolekul. Ühingu lõpetamise, ühinemise või jagunemise otsus on vastu võetud, kui selle poolt hääletavad üle 2/3 koosolekul osalenud liikmetest või nende esindajatest."
      - text: "8.3 Ühingu likvideerijaks on juhatus."
      - text: "8.4 Pärast võlausaldajate kõigi nõuete rahuldamist ja nõuet mitte esitanud teada olevate võlausaldajate raha deponeerimist jaotatakse ülejäänud vara üldkoosoleku otsusega määratud õigustatud isikute vahel."
